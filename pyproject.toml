[project]
name = "wardrobe"
version = "0.1.0"
description = "Upload clothes, get outfit suggestions, see what a new piece unlocks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "anthropic>=1.11.0",
    "pillow-heif>=1.8.0",
    "numpy>=2.5.3",
    "httpx>=0.28.1",
    "extruct>=0.18.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "argon2-cffi>=25.1.0",
    "minio>=7.2.20",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.63.0",
]
# Transparent cutouts. Too big for a serverless function (numba, scipy, onnxruntime and a
# 170 MB model), so Vercel installs without it and shows the original photo instead.
cutout = [
    "rembg[cpu]>=2.0.85",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.168.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: slow tests (real rembg model, benchmarks); run with -m slow"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "migrations"]
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["alembic.*", "rembg.*", "extruct.*", "playwright.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The golden tables are data: one outfit per line reads better than wrapped tuples.
"tests/engine/test_golden.py" = ["E501"]
