{% extends "base.html" %}
{% block title %}Log in · Wardrobe{% endblock %}
{% block content %}
  <div class="auth-card stack">
    <h1 class="display-md">Log in</h1>
    {% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form class="stack panel" method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <input type="hidden" name="next" value="{{ next }}" />
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="username" required value="{{ email }}" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Log in</button>
        <a href="/forgot">Forgot your password?</a>
      </div>
    </form>
    <p class="caption">New here? <a href="/register">Create an account</a></p>
  </div>
{% endblock %}
