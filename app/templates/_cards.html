{% for item in page.items %}
  {% include "_item_card.html" %}
{% endfor %}
{% if page.has_more %}
  <div class="more">
    <button
      class="btn btn-outline"
      type="button"
      hx-get="/closet?{{ next_query }}"
      hx-target="closest .more"
      hx-swap="outerHTML"
      hx-push-url="false"
    >Load more</button>
  </div>
{% endif %}
